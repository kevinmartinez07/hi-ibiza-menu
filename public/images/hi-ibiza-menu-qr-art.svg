<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
  <title id="title">QR de la carta HI Ibiza Cocktails</title>
  <desc id="desc">Escanea para abrir la carta digital de HI Ibiza Cocktails.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08050d"/>
      <stop offset="0.55" stop-color="#1a071d"/>
      <stop offset="1" stop-color="#09050f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#ff6be9"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ff2bd6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="1400" rx="54" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="1344" rx="38" fill="none" stroke="#35143c" stroke-width="2"/>
  <path d="M72 255h1056M72 1145h1056" stroke="#35143c" stroke-width="2"/>
  <path d="M72 255h280M848 255h280M72 1145h280M848 1145h280" stroke="url(#neon)" stroke-width="6" filter="url(#glow)"/>
  <rect x="72" y="72" width="1056" height="1056" rx="28" fill="url(#dots)" opacity="0.22"/>

  <image href="/images/brand/hi-ibiza-logo.webp" x="340" y="72" width="520" height="164" preserveAspectRatio="xMidYMid meet"/>
  <text x="600" y="300" fill="#ff2bd6" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7" text-anchor="middle">ESCANEA LA CARTA</text>
  <text x="600" y="340" fill="#d8c8da" font-family="Arial, sans-serif" font-size="22" letter-spacing="2" text-anchor="middle">VIVE LA NOCHE · DISFRUTA EL MOMENTO</text>

  <rect x="198" y="390" width="804" height="804" rx="44" fill="#fff"/>
  <rect x="224" y="416" width="752" height="752" rx="26" fill="none" stroke="#ff2bd6" stroke-width="4"/>
  <image href="/images/hi-ibiza-menu-qr.png" x="270" y="462" width="660" height="660" preserveAspectRatio="xMidYMid meet"/>

  <circle cx="104" cy="1280" r="16" fill="#ff2bd6"/>
  <circle cx="1096" cy="1280" r="16" fill="#ff2bd6"/>
  <text x="600" y="1290" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5" text-anchor="middle">HI IBIZA COCKTAILS</text>
</svg>
